<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brain Tumor Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            margin-top: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .btn-primary {
            border-radius: 20px;
        }
        .result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .spinner-border {
            display: none;
            margin-top: 20px;
        }
        .uploaded-image {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
        }
    </style>

</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card p-4">
                <h2 class="text-center mb-4">Brain Tumor Detection 🧠</h2>

                <form method="POST" action="/" enctype="multipart/form-data" onsubmit="showLoading()">
                    <div class="mb-3">
                        <input class="form-control" type="file" name="file" required>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary" type="submit">Predict</button>
                    </div>
                </form>

                {% if prediction %}
                <div class="result text-center text-success">
                    {{ prediction }}
                </div>

                <!-- Uploaded Image Display -->
                <div class="text-center">
                    <img src="{{ img_path }}" alt="Uploaded Image" class="uploaded-image mt-3">
                </div>
                {% endif %}

                <div class="text-center">
                    <div class="spinner-border text-primary" role="status" id="loadingSpinner">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showLoading() {
    document.getElementById('loadingSpinner').style.display = 'block';
}
</script>

</body>
</html>
